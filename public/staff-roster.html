<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>Staff Roster — Zenith</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #f8f9fa;
      --surface: #ffffff;
      --surface2: #f0f2f5;
      --border: #e0e0e0;
      --primary: #d4af37;
      --text: #2c3e50;
      --muted: #7f8c8d;
      --success: #27ae60;
      --error: #e74c3c;
    }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    a { color: inherit; text-decoration: none; }
    
    nav {
      border-bottom: 2px solid #d4af37;
      background: var(--surface);
      padding: 16px 24px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    .nav-inner {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      font-size: 18px;
    }
    .logo-icon {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, #d4af37, #ffd700);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #1a1a1a;
      font-weight: 900;
    }
    .nav-right {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.15s;
      text-decoration: none;
    }
    .btn-primary {
      background: linear-gradient(135deg, #d4af37, #ffd700);
      color: #1a1a1a;
      border: none;
    }
    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(212,175,55,0.4);
    }
    .btn-ghost {
      background: white;
      color: var(--text);
      border: 2px solid #d4af37;
    }
    .btn-ghost:hover {
      background: #d4af37;
      color: white;
    }
    
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 40px 24px;
    }
    
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 32px;
    }
    .header h1 {
      font-size: 28px;
      font-weight: 800;
    }
    
    .controls {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
    }
    .search-box {
      flex: 1;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-family: inherit;
    }
    .search-box:focus {
      outline: none;
      border-color: #d4af37;
      box-shadow: 0 0 0 3px rgba(212,175,55,0.1);
    }
    
    .roster-table {
      width: 100%;
      background: var(--surface);
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border);
    }
    
    table {
      width: 100%;
      border-collapse: collapse;
    }
    
    thead {
      background: var(--surface2);
      border-bottom: 2px solid var(--border);
    }
    
    th {
      padding: 16px;
      text-align: left;
      font-weight: 700;
      color: var(--text);
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    
    td {
      padding: 16px;
      border-bottom: 1px solid var(--border);
    }
    
    tbody tr:hover {
      background: var(--surface2);
    }
    
    .staff-member {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    
    .member-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 2px solid #d4af37;
    }
    
    .member-info h4 {
      font-weight: 600;
      margin-bottom: 2px;
    }
    
    .member-info p {
      color: var(--muted);
      font-size: 12px;
    }
    
    .rank-badge {
      background: linear-gradient(135deg, #d4af37, #ffd700);
      color: #1a1a1a;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      display: inline-block;
    }
    
    .status-badge {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      margin-right: 6px;
    }
    .status-badge.active {
      background: var(--success);
    }
    .status-badge.inactive {
      background: var(--muted);
    }
    
    .actions {
      display: flex;
      gap: 8px;
    }
    
    .action-btn {
      width: 32px;
      height: 32px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
      font-size: 14px;
    }
    
    .action-btn.edit {
      background: rgba(33,150,243,0.1);
      color: #2196f3;
    }
    .action-btn.edit:hover {
      background: rgba(33,150,243,0.2);
    }
    
    .action-btn.remove {
      background: rgba(231,76,60,0.1);
      color: var(--error);
    }
    .action-btn.remove:hover {
      background: rgba(231,76,60,0.2);
    }
    
    .empty-state {
      text-align: center;
      padding: 60px 24px;
      color: var(--muted);
    }
    
    .empty-state i {
      font-size: 48px;
      margin-bottom: 16px;
      color: var(--border);
    }
    
    @media (max-width: 768px) {
      .header {
        flex-direction: column;
        align-items: flex-start;
        gap: 16px;
      }
      .controls {
        flex-direction: column;
      }
      table {
        font-size: 13px;
      }
      th, td {
        padding: 12px;
      }
    }
  </style>
</head>
<body>

<nav>
  <div class="nav-inner">
    <a href="/" class="logo">
      <div class="logo-icon">Z</div>
      Zenith
    </a>
    <div class="nav-right">
      <button class="btn btn-ghost" onclick="logout()">
        <i class="fas fa-sign-out-alt"></i> Logout
      </button>
    </div>
  </div>
</nav>

<div class="container">
  <div class="header">
    <h1><i class="fas fa-users"></i> Staff Roster</h1>
    <button class="btn btn-primary" onclick="addStaffMember()">
      <i class="fas fa-plus"></i> Add Staff Member
    </button>
  </div>

  <div class="controls">
    <input type="text" id="search" class="search-box" placeholder="Search by name, username, or role..." onkeyup="filterRoster()">
    <select id="rank-filter" class="search-box" style="flex: 0 1 200px;" onchange="filterRoster()">
      <option value="">All Ranks</option>
      <option value="Owner">Owner</option>
      <option value="Manager">Manager</option>
      <option value="Moderator">Moderator</option>
      <option value="Helper">Helper</option>
    </select>
  </div>

  <div class="roster-table">
    <table>
      <thead>
        <tr>
          <th>Member</th>
          <th>Rank</th>
          <th>Joined</th>
          <th>Hours</th>
          <th>Strikes</th>
          <th>Status</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="roster-body">
        <tr>
          <td colspan="7" style="text-align: center; padding: 40px;">
            <i class="fas fa-spinner fa-spin"></i> Loading staff roster...
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<script>
  const guildId = new URLSearchParams(window.location.search).get('id');
  let allStaff = [];

  async function loadRoster() {
    try {
      const res = await fetch(`/api/guilds/${guildId}/staff`);
      if (!res.ok) return;
      allStaff = await res.json();
      renderRoster(allStaff);
    } catch (err) {
      console.error('Failed to load roster:', err);
    }
  }

  function renderRoster(staff) {
    const tbody = document.getElementById('roster-body');
    if (!staff || staff.length === 0) {
      tbody.innerHTML = `
        <tr>
          <td colspan="7">
            <div class="empty-state">
              <i class="fas fa-inbox"></i>
              <h3>No staff members yet</h3>
              <p>Add your first staff member to get started</p>
            </div>
          </td>
        </tr>
      `;
      return;
    }

    tbody.innerHTML = staff.map(member => `
      <tr>
        <td>
          <div class="staff-member">
            <img src="${member.avatarUrl || 'https://via.placeholder.com/36'}" alt="${member.username}" class="member-avatar">
            <div class="member-info">
              <h4>${member.username}</h4>
              <p>${member.discordUsername || member.robloxUsername || 'N/A'}</p>
            </div>
          </div>
        </td>
        <td><span class="rank-badge">${member.rank || 'Staff'}</span></td>
        <td>${new Date(member.joinedAt).toLocaleDateString()}</td>
        <td>${member.hours || 0}h</td>
        <td>${member.strikeCount || 0}</td>
        <td>
          <span class="status-badge ${member.isActive ? 'active' : 'inactive'}"></span>
          ${member.isActive ? 'Active' : 'Inactive'}
        </td>
        <td>
          <div class="actions">
            <button class="action-btn edit" onclick="editMember('${member.id}')">
              <i class="fas fa-edit"></i>
            </button>
            <button class="action-btn remove" onclick="removeMember('${member.id}')">
              <i class="fas fa-trash"></i>
            </button>
          </div>
        </td>
      </tr>
    `).join('');
  }

  function filterRoster() {
    const search = document.getElementById('search').value.toLowerCase();
    const rankFilter = document.getElementById('rank-filter').value;

    const filtered = allStaff.filter(member => {
      const matchesSearch = !search || 
        member.username.toLowerCase().includes(search) ||
        (member.discordUsername && member.discordUsername.toLowerCase().includes(search)) ||
        (member.rank && member.rank.toLowerCase().includes(search));
      
      const matchesRank = !rankFilter || member.rank === rankFilter;
      
      return matchesSearch && matchesRank;
    });

    renderRoster(filtered);
  }

  function addStaffMember() {
    alert('Add staff member feature coming soon!');
  }

  function editMember(memberId) {
    alert('Edit member feature coming soon!');
  }

  function removeMember(memberId) {
    if (confirm('Are you sure you want to remove this staff member?')) {
      alert('Member removal feature coming soon!');
    }
  }

  async function logout() {
    await fetch('/api/auth/logout', { method: 'POST' });
    window.location.href = '/';
  }

  loadRoster();
</script>

</body>
</html>
