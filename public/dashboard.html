<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zenith Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
        :root {
            --bg: #08090e;
            --surface: #0d0f18;
            --surface2: #12141f;
            --border: rgba(255, 255, 255, 0.07);
            --primary: #6366f1;
            --primary-hover: #818cf8;
            --text: #e2e8f0;
            --text-muted: #64748b;
            --success: #22c55e;
            --danger: #ef4444;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        .container {
            display: flex;
            height: 100vh;
        }

        /* SIDEBAR */
        .sidebar {
            width: 260px;
            background: var(--surface);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 20px;
            overflow-y: auto;
        }

        .sidebar-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 700;
            font-size: 16px;
        }

        .logo-icon {
            width: 32px;
            height: 32px;
            background: var(--primary);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 14px;
            color: white;
        }

        .user-section {
            margin-bottom: 30px;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            border-radius: 8px;
            background: var(--surface2);
        }

        .user-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 14px;
            color: white;
            flex-shrink: 0;
        }

        .user-details h4 {
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 2px;
        }

        .user-details p {
            font-size: 12px;
            color: var(--text-muted);
        }

        /* NAV SECTION */
        .nav-section {
            margin-bottom: 25px;
        }

        .nav-section-title {
            font-size: 11px;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-bottom: 10px;
            padding: 0 8px;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            color: var(--text-muted);
            font-size: 14px;
            border-left: 3px solid transparent;
        }

        .nav-item:hover {
            background: rgba(99, 102, 241, 0.1);
            color: var(--text);
        }

        .nav-item.active {
            background: rgba(99, 102, 241, 0.15);
            border-left-color: var(--primary);
            color: var(--primary);
        }

        .nav-item i {
            width: 18px;
            text-align: center;
        }

        .sidebar-footer {
            margin-top: auto;
            padding-top: 20px;
            border-top: 1px solid var(--border);
        }

        .logout-btn {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            padding: 10px 12px;
            background: none;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            color: var(--danger);
            font-size: 14px;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .logout-btn:hover {
            background: rgba(239, 68, 68, 0.1);
        }

        /* MAIN CONTENT */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .header {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 20px 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header-title {
            font-size: 24px;
            font-weight: 700;
        }

        .header-actions {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .icon-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 18px;
            cursor: pointer;
            transition: color 0.2s ease;
            display: none;
        }

        .icon-btn:hover {
            color: var(--primary);
        }

        .content {
            padding: 30px;
            flex: 1;
            overflow-y: auto;
        }

        /* WELCOME CARD */
        .welcome-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            gap: 25px;
        }

        .welcome-avatar {
            width: 80px;
            height: 80px;
            border-radius: 12px;
            background: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: 700;
            color: white;
            flex-shrink: 0;
        }

        .welcome-text h2 {
            font-size: 26px;
            margin-bottom: 6px;
        }

        .welcome-text p {
            color: var(--text-muted);
            font-size: 14px;
        }

        /* SERVERS SECTION */
        .servers-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .servers-header h3 {
            font-size: 18px;
            font-weight: 700;
        }

        .refresh-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 16px;
            background: rgba(99, 102, 241, 0.1);
            border: 1px solid var(--primary);
            border-radius: 8px;
            color: var(--primary);
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .refresh-btn:hover {
            background: rgba(99, 102, 241, 0.2);
        }

        .refresh-btn.loading {
            opacity: 0.6;
            pointer-events: none;
        }

        .refresh-icon {
            display: inline-block;
            width: 16px;
            height: 16px;
        }

        .refresh-icon.spinning {
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* SERVER CARDS */
        .servers-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 16px;
        }

        .server-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            transition: all 0.2s ease;
        }

        .server-card:hover {
            border-color: rgba(99, 102, 241, 0.35);
            background: rgba(99, 102, 241, 0.05);
        }

        .server-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
        }

        .server-icon {
            width: 48px;
            height: 48px;
            border-radius: 8px;
            background: var(--surface2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: 700;
            color: var(--primary);
            flex-shrink: 0;
        }

        .server-info h4 {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .server-role {
            font-size: 12px;
            color: var(--text-muted);
        }

        .server-status {
            font-size: 12px;
            color: var(--danger);
            margin-top: 4px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .server-status.active {
            color: var(--success);
        }

        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: currentColor;
        }

        .server-action {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.2s ease;
            margin-top: 15px;
        }

        .manage-btn {
            background: rgba(99, 102, 241, 0.15);
            color: var(--primary);
            border: 1px solid var(--primary);
        }

        .manage-btn:hover {
            background: rgba(99, 102, 241, 0.25);
        }

        .add-bot-btn {
            background: var(--primary);
            color: white;
            border: 1px solid var(--primary);
        }

        .add-bot-btn:hover {
            background: var(--primary-hover);
            border-color: var(--primary-hover);
        }

        /* EMPTY STATE */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
        }

        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }

        /* RESPONSIVE */
        @media (max-width: 768px) {
            .container {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
                height: auto;
                border-right: none;
                border-bottom: 1px solid var(--border);
                position: fixed;
                top: 0;
                left: -260px;
                height: 100vh;
                transition: left 0.3s ease;
                z-index: 1000;
            }

            .sidebar.open {
                left: 0;
            }

            .icon-btn {
                display: block;
            }

            .main-content {
                padding-top: 60px;
            }

            .header {
                padding: 15px 20px;
            }

            .content {
                padding: 20px;
            }

            .servers-grid {
                grid-template-columns: 1fr;
            }

            .welcome-card {
                flex-direction: column;
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- SIDEBAR -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <div class="logo-icon">Z</div>
                    <span>Zenith</span>
                </div>
            </div>

            <!-- USER SECTION -->
            <div class="user-section">
                <div class="user-info">
                    <div class="user-avatar" id="userAvatar">Z</div>
                    <div class="user-details">
                        <h4 id="userName">Loading...</h4>
                        <p id="userId">...</p>
                    </div>
                </div>
            </div>

            <!-- NAVIGATION -->
            <div class="nav-section">
                <div class="nav-section-title">Menu</div>
                <a href="#" class="nav-item active">
                    <i class="fas fa-th-large"></i>
                    <span>Dashboard</span>
                </a>
                <a href="#" class="nav-item">
                    <i class="fas fa-cog"></i>
                    <span>Settings</span>
                </a>
            </div>

            <!-- RESOURCES -->
            <div class="nav-section">
                <div class="nav-section-title">Resources</div>
                <a href="#" class="nav-item">
                    <i class="fas fa-circle-question"></i>
                    <span>Support</span>
                </a>
                <a href="#" class="nav-item">
                    <i class="fas fa-star"></i>
                    <span>Premium</span>
                </a>
            </div>

            <!-- FOOTER -->
            <div class="sidebar-footer">
                <button class="logout-btn" onclick="logout()">
                    <i class="fas fa-sign-out-alt"></i>
                    <span>Sign Out</span>
                </button>
            </div>
        </aside>

        <!-- MAIN CONTENT -->
        <div class="main-content">
            <!-- HEADER -->
            <header class="header">
                <h1 class="header-title">Zenith Dashboard</h1>
                <div class="header-actions">
                    <button class="icon-btn" onclick="toggleSidebar()">
                        <i class="fas fa-bars"></i>
                    </button>
                </div>
            </header>

            <!-- CONTENT -->
            <div class="content">
                <!-- WELCOME CARD -->
                <div class="welcome-card">
                    <div class="welcome-avatar" id="welcomeAvatar">Z</div>
                    <div class="welcome-text">
                        <h2>Good <span id="timeGreeting">afternoon</span>, <span id="welcomeName">User</span></h2>
                        <p>Managing <span id="serverCount">0</span> servers</p>
                    </div>
                </div>

                <!-- SERVERS SECTION -->
                <div class="servers-header">
                    <h3>My Servers</h3>
                    <button class="refresh-btn" onclick="refreshServers()">
                        <i class="fas fa-sync-alt refresh-icon" id="refreshIcon"></i>
                        <span>Refresh</span>
                    </button>
                </div>

                <!-- SERVERS GRID -->
                <div class="servers-grid" id="serversGrid">
                    <div class="empty-state">
                        <div class="empty-state-icon">
                            <i class="fas fa-hourglass-start"></i>
                        </div>
                        <p>Loading your servers...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Check if user is logged in
        async function checkAuth() {
            try {
                const response = await fetch('/api/auth/user');
                if (!response.ok) {
                    window.location.href = '/';
                    return null;
                }
                return await response.json();
            } catch (error) {
                console.error('Auth check failed:', error);
                window.location.href = '/';
                return null;
            }
        }

        // Load user data
        async function loadUserData() {
            const user = await checkAuth();
            if (!user) return;

            document.getElementById('userName').textContent = user.username || 'User';
            document.getElementById('userId').textContent = user.id || '';
            document.getElementById('welcomeName').textContent = user.username || 'User';

            const firstLetter = (user.username || 'Z')[0].toUpperCase();
            document.getElementById('userAvatar').textContent = firstLetter;
            document.getElementById('welcomeAvatar').textContent = firstLetter;

            loadServers();
        }

        // Load servers
        async function loadServers() {
            try {
                const response = await fetch('/api/auth/guilds');
                if (!response.ok) throw new Error('Failed to load servers');
                
                const servers = await response.json();
                displayServers(servers);
            } catch (error) {
                console.error('Failed to load servers:', error);
                document.getElementById('serversGrid').innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">
                            <i class="fas fa-exclamation-circle"></i>
                        </div>
                        <p>Failed to load servers. Please try again.</p>
                    </div>
                `;
            }
        }

        // Display servers
        function displayServers(servers) {
            document.getElementById('serverCount').textContent = servers.length;

            if (servers.length === 0) {
                document.getElementById('serversGrid').innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">
                            <i class="fas fa-inbox"></i>
                        </div>
                        <p>No servers found. You need to be an admin or owner of a server.</p>
                    </div>
                `;
                return;
            }

            const grid = document.getElementById('serversGrid');
            grid.innerHTML = servers.map(server => `
                <div class="server-card">
                    <div class="server-header">
                        <div class="server-icon">${(server.name || 'S')[0]}</div>
                        <div class="server-info">
                            <h4>${server.name || 'Unknown Server'}</h4>
                            <p class="server-role">${server.role || 'Member'}</p>
                            <p class="server-status ${server.botAdded ? 'active' : ''}">
                                <span class="status-dot"></span>
                                ${server.botAdded ? 'Bot Active' : 'Bot not added'}
                            </p>
                        </div>
                    </div>
                    <button class="server-action ${server.botAdded ? 'manage-btn' : 'add-bot-btn'}">
                        <i class="fas ${server.botAdded ? 'fa-sliders-h' : 'fa-plus'}"></i>
                        ${server.botAdded ? 'Configure' : 'Add Bot'}
                    </button>
                </div>
            `).join('');
        }

        // Refresh servers
        async function refreshServers() {
            const btn = document.querySelector('.refresh-btn');
            const icon = document.getElementById('refreshIcon');
            
            btn.classList.add('loading');
            icon.classList.add('spinning');

            await loadServers();

            btn.classList.remove('loading');
            icon.classList.remove('spinning');
        }

        // Toggle sidebar
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
        }

        // Logout
        async function logout() {
            try {
                await fetch('/auth/logout', { method: 'POST' });
                window.location.href = '/';
            } catch (error) {
                console.error('Logout failed:', error);
            }
        }

        // Set time-based greeting
        function setGreeting() {
            const hour = new Date().getHours();
            let greeting = 'afternoon';
            if (hour < 12) greeting = 'morning';
            else if (hour < 18) greeting = 'afternoon';
            else greeting = 'evening';
            document.getElementById('timeGreeting').textContent = greeting;
        }

        // Initialize
        setGreeting();
        loadUserData();
    </script>
</body>
</html>
