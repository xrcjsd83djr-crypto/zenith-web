<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zenith Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #0a0e27;
            color: #e0e0e0;
            overflow-x: hidden;
        }

        .container {
            display: flex;
            height: 100vh;
        }

        /* SIDEBAR */
        .sidebar {
            width: 280px;
            background: #0f1229;
            border-right: 1px solid #1a1f3a;
            display: flex;
            flex-direction: column;
            padding: 20px;
            overflow-y: auto;
            position: relative;
        }

        .sidebar-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid #1a1f3a;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
        }

        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 18px;
            position: relative;
        }

        .user-avatar::after {
            content: '';
            position: absolute;
            bottom: 0;
            right: 0;
            width: 12px;
            height: 12px;
            background: #10b981;
            border-radius: 50%;
            border: 2px solid #0f1229;
        }

        .user-details h3 {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 2px;
        }

        .user-details p {
            font-size: 12px;
            color: #888;
        }

        .online-badge {
            display: inline-block;
            padding: 4px 12px;
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid #10b981;
            border-radius: 20px;
            font-size: 12px;
            color: #10b981;
            margin-top: 8px;
        }

        .close-btn {
            background: none;
            border: none;
            color: #666;
            font-size: 24px;
            cursor: pointer;
            display: none;
        }

        /* NAVIGATION */
        .nav-section {
            margin-bottom: 30px;
        }

        .nav-section-title {
            font-size: 11px;
            font-weight: 700;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 12px;
            padding: 0 12px;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            color: #b0b0b0;
            text-decoration: none;
            font-size: 14px;
            border-left: 3px solid transparent;
        }

        .nav-item:hover {
            background: rgba(102, 126, 234, 0.1);
            color: #e0e0e0;
        }

        .nav-item.active {
            background: rgba(102, 126, 234, 0.15);
            border-left-color: #667eea;
            color: #667eea;
        }

        .resources-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 12px;
            cursor: pointer;
        }

        .resources-toggle {
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #666;
        }

        .resources-items {
            display: none;
        }

        .resources-items.open {
            display: block;
        }

        .resource-link {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            color: #b0b0b0;
            font-size: 14px;
            margin-top: 8px;
        }

        .resource-link:hover {
            background: rgba(102, 126, 234, 0.1);
            color: #e0e0e0;
        }

        .external-icon {
            width: 16px;
            height: 16px;
            color: #666;
        }

        .sidebar-footer {
            margin-top: auto;
            padding-top: 20px;
            border-top: 1px solid #1a1f3a;
        }

        .sign-out-btn {
            display: flex;
            align-items: center;
            gap: 12px;
            width: 100%;
            padding: 12px;
            background: none;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            color: #ff6b6b;
            font-size: 14px;
            transition: all 0.2s ease;
        }

        .sign-out-btn:hover {
            background: rgba(255, 107, 107, 0.1);
        }

        /* MAIN CONTENT */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .header {
            background: #0f1229;
            border-bottom: 1px solid #1a1f3a;
            padding: 20px 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header-title {
            font-size: 24px;
            font-weight: 700;
        }

        .header-actions {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .header-btn {
            background: none;
            border: none;
            color: #e0e0e0;
            font-size: 20px;
            cursor: pointer;
            transition: color 0.2s ease;
        }

        .header-btn:hover {
            color: #667eea;
        }

        .menu-toggle {
            display: none;
        }

        .content {
            padding: 30px;
            flex: 1;
            overflow-y: auto;
        }

        /* WELCOME CARD */
        .welcome-card {
            background: linear-gradient(135deg, #1a1f3a 0%, #0f1229 100%);
            border: 1px solid #1a1f3a;
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            gap: 30px;
        }

        .welcome-avatar {
            width: 80px;
            height: 80px;
            border-radius: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            font-weight: bold;
            flex-shrink: 0;
        }

        .welcome-text h2 {
            font-size: 28px;
            margin-bottom: 8px;
        }

        .welcome-text p {
            color: #999;
            font-size: 14px;
        }

        /* SERVERS SECTION */
        .servers-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .servers-header h3 {
            font-size: 20px;
            font-weight: 700;
        }

        .refresh-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 16px;
            background: rgba(102, 126, 234, 0.1);
            border: 1px solid #667eea;
            border-radius: 8px;
            color: #667eea;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s ease;
        }

        .refresh-btn:hover {
            background: rgba(102, 126, 234, 0.2);
        }

        .refresh-btn.loading {
            opacity: 0.6;
            pointer-events: none;
        }

        .refresh-icon {
            width: 16px;
            height: 16px;
            display: inline-block;
        }

        .refresh-icon.spinning {
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* SERVER CARDS */
        .servers-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
        }

        .server-card {
            background: #0f1229;
            border: 1px solid #1a1f3a;
            border-radius: 12px;
            padding: 20px;
            transition: all 0.2s ease;
        }

        .server-card:hover {
            border-color: #667eea;
            background: rgba(102, 126, 234, 0.05);
        }

        .server-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
        }

        .server-icon {
            width: 50px;
            height: 50px;
            border-radius: 8px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: bold;
            flex-shrink: 0;
        }

        .server-info h4 {
            font-size: 16px;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .server-role {
            font-size: 12px;
            color: #999;
        }

        .server-status {
            font-size: 12px;
            color: #ff6b6b;
            margin-top: 4px;
        }

        .server-status.installed {
            color: #10b981;
        }

        .server-action {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.2s ease;
            margin-top: 15px;
        }

        .manage-btn {
            background: rgba(102, 126, 234, 0.2);
            color: #667eea;
            border: 1px solid #667eea;
        }

        .manage-btn:hover {
            background: rgba(102, 126, 234, 0.3);
        }

        .add-bot-btn {
            background: #667eea;
            color: white;
            border: 1px solid #667eea;
        }

        .add-bot-btn:hover {
            background: #5568d3;
        }

        /* EMPTY STATE */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #666;
        }

        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 20px;
        }

        /* RESPONSIVE */
        @media (max-width: 768px) {
            .container {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
                height: auto;
                border-right: none;
                border-bottom: 1px solid #1a1f3a;
                padding: 15px;
                position: fixed;
                top: 0;
                left: -280px;
                height: 100vh;
                transition: left 0.3s ease;
                z-index: 1000;
            }

            .sidebar.open {
                left: 0;
            }

            .menu-toggle {
                display: block;
            }

            .close-btn {
                display: block;
            }

            .main-content {
                padding-top: 60px;
            }

            .header {
                padding: 15px 20px;
            }

            .content {
                padding: 20px;
            }

            .servers-grid {
                grid-template-columns: 1fr;
            }

            .welcome-card {
                flex-direction: column;
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- SIDEBAR -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="user-info">
                    <div class="user-avatar" id="userAvatar">Z</div>
                    <div class="user-details">
                        <h3 id="userName">Loading...</h3>
                        <p id="userId">...</p>
                        <div class="online-badge">Online</div>
                    </div>
                </div>
                <button class="close-btn" onclick="toggleSidebar()">✕</button>
            </div>

            <!-- GENERAL NAV -->
            <div class="nav-section">
                <div class="nav-section-title">General</div>
                <a href="#" class="nav-item active">
                    <span>🏠</span>
                    <span>Dashboard</span>
                </a>
                <a href="#" class="nav-item">
                    <span>👤</span>
                    <span>Account Settings</span>
                </a>
                <a href="#" class="nav-item">
                    <span>⭐</span>
                    <span>Manage Premium</span>
                </a>
            </div>

            <!-- RESOURCES NAV -->
            <div class="nav-section">
                <div class="resources-header" onclick="toggleResources()">
                    <div class="nav-section-title">Resources</div>
                    <div class="resources-toggle">▼</div>
                </div>
                <div class="resources-items open">
                    <div class="resource-link">
                        <span>🔔 Support Server</span>
                        <span class="external-icon">↗</span>
                    </div>
                    <div class="resource-link">
                        <span>👑 Premium</span>
                        <span class="external-icon">↗</span>
                    </div>
                </div>
            </div>

            <!-- FOOTER -->
            <div class="sidebar-footer">
                <button class="sign-out-btn" onclick="logout()">
                    <span>↩</span>
                    <span>Sign Out</span>
                </button>
            </div>
        </aside>

        <!-- MAIN CONTENT -->
        <div class="main-content">
            <!-- HEADER -->
            <header class="header">
                <h1 class="header-title">Zenith Dashboard</h1>
                <div class="header-actions">
                    <button class="header-btn" onclick="toggleNotifications()">🔔</button>
                    <button class="header-btn menu-toggle" onclick="toggleSidebar()">☰</button>
                </div>
            </header>

            <!-- CONTENT -->
            <div class="content">
                <!-- WELCOME CARD -->
                <div class="welcome-card">
                    <div class="welcome-avatar" id="welcomeAvatar">Z</div>
                    <div class="welcome-text">
                        <h2>Good <span id="timeGreeting">afternoon</span>, <span id="welcomeName">User</span></h2>
                        <p>Managing <span id="serverCount">0</span> servers</p>
                    </div>
                </div>

                <!-- SERVERS SECTION -->
                <div class="servers-header">
                    <h3>My Servers</h3>
                    <button class="refresh-btn" onclick="refreshServers()">
                        <span class="refresh-icon" id="refreshIcon">🔄</span>
                        <span>Refresh</span>
                    </button>
                </div>

                <!-- SERVERS GRID -->
                <div class="servers-grid" id="serversGrid">
                    <div class="empty-state">
                        <div class="empty-state-icon">⏳</div>
                        <p>Loading your servers...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Check if user is logged in
        async function checkAuth() {
            try {
                const response = await fetch('/api/auth/user');
                if (!response.ok) {
                    window.location.href = '/';
                    return null;
                }
                return await response.json();
            } catch (error) {
                console.error('Auth check failed:', error);
                window.location.href = '/';
                return null;
            }
        }

        // Load user data
        async function loadUserData() {
            const user = await checkAuth();
            if (!user) return;

            document.getElementById('userName').textContent = user.username || 'User';
            document.getElementById('userId').textContent = user.id || '';
            document.getElementById('welcomeName').textContent = user.username || 'User';

            const firstLetter = (user.username || 'Z')[0].toUpperCase();
            document.getElementById('userAvatar').textContent = firstLetter;
            document.getElementById('welcomeAvatar').textContent = firstLetter;

            loadServers();
        }

        // Load servers
        async function loadServers() {
            try {
                const response = await fetch('/api/auth/guilds');
                if (!response.ok) throw new Error('Failed to load servers');
                
                const servers = await response.json();
                displayServers(servers);
            } catch (error) {
                console.error('Failed to load servers:', error);
                document.getElementById('serversGrid').innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">❌</div>
                        <p>Failed to load servers. Please try again.</p>
                    </div>
                `;
            }
        }

        // Display servers
        function displayServers(servers) {
            document.getElementById('serverCount').textContent = servers.length;

            if (servers.length === 0) {
                document.getElementById('serversGrid').innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">📭</div>
                        <p>No servers found. You need to be an admin or owner of a server.</p>
                    </div>
                `;
                return;
            }

            const grid = document.getElementById('serversGrid');
            grid.innerHTML = servers.map(server => `
                <div class="server-card">
                    <div class="server-header">
                        <div class="server-icon">${(server.name || 'S')[0]}</div>
                        <div class="server-info">
                            <h4>${server.name || 'Unknown Server'}</h4>
                            <p class="server-role">${server.role || 'Member'}</p>
                            <p class="server-status ${server.botAdded ? 'installed' : ''}">
                                ${server.botAdded ? '✓ Bot Added' : '✗ Bot not added'}
                            </p>
                        </div>
                    </div>
                    <button class="server-action ${server.botAdded ? 'manage-btn' : 'add-bot-btn'}">
                        ${server.botAdded ? '⚙️ Configure' : '➕ Add Bot'}
                    </button>
                </div>
            `).join('');
        }

        // Refresh servers
        async function refreshServers() {
            const btn = document.querySelector('.refresh-btn');
            const icon = document.getElementById('refreshIcon');
            
            btn.classList.add('loading');
            icon.classList.add('spinning');

            await loadServers();

            btn.classList.remove('loading');
            icon.classList.remove('spinning');
        }

        // Toggle sidebar
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
        }

        // Toggle resources
        function toggleResources() {
            document.querySelector('.resources-items').classList.toggle('open');
        }

        // Logout
        async function logout() {
            try {
                await fetch('/api/auth/logout', { method: 'POST' });
                window.location.href = '/';
            } catch (error) {
                console.error('Logout failed:', error);
            }
        }

        // Toggle notifications
        function toggleNotifications() {
            alert('Notifications coming soon!');
        }

        // Set time-based greeting
        function setGreeting() {
            const hour = new Date().getHours();
            let greeting = 'afternoon';
            if (hour < 12) greeting = 'morning';
            else if (hour < 18) greeting = 'afternoon';
            else greeting = 'evening';
            document.getElementById('timeGreeting').textContent = greeting;
        }

        // Initialize
        setGreeting();
        loadUserData();
    </script>
</body>
</html>
