<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zenith Admin Portal</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root { --primary: #d4af37; --dark: #1a1a1a; --darker: #0f0f0f; --light: #f5f5f5; --muted: #999; --success: #27ae60; --danger: #e74c3c; }
    body { font-family: 'Segoe UI', sans-serif; background: var(--darker); color: var(--light); }
    .pin-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--darker); display: flex; align-items: center; justify-content: center; z-index: 9999; }
    .pin-container { background: var(--dark); border: 2px solid var(--primary); border-radius: 16px; padding: 40px; text-align: center; max-width: 400px; box-shadow: 0 0 30px rgba(212, 175, 55, 0.3); }
    .pin-container h1 { font-size: 28px; margin-bottom: 20px; color: var(--primary); }
    .pin-container p { color: var(--muted); margin-bottom: 30px; }
    .pin-input { width: 100%; padding: 12px 16px; background: rgba(212, 175, 55, 0.1); border: 1px solid var(--primary); border-radius: 8px; color: var(--light); font-size: 18px; letter-spacing: 3px; text-align: center; font-weight: bold; }
    .pin-input::placeholder { color: var(--muted); }
    .pin-btn { width: 100%; padding: 12px; background: var(--primary); color: var(--dark); border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 20px; font-size: 16px; }
    .pin-btn:hover { background: #ffd700; }
    .pin-error { color: var(--danger); font-size: 12px; margin-top: 10px; }
    
    .admin-container { display: flex; min-height: 100vh; }
    .admin-sidebar { width: 280px; background: var(--dark); border-right: 2px solid var(--primary); padding: 20px; overflow-y: auto; position: fixed; height: 100vh; left: 0; }
    .admin-sidebar-header { display: flex; align-items: center; gap: 12px; margin-bottom: 40px; }
    .admin-sidebar-header .logo { width: 40px; height: 40px; background: var(--primary); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: bold; color: var(--dark); }
    .admin-nav { display: flex; flex-direction: column; gap: 8px; }
    .admin-nav-item { padding: 12px 16px; border-radius: 6px; cursor: pointer; display: flex; align-items: center; gap: 12px; transition: all 0.3s; }
    .admin-nav-item:hover { background: rgba(212, 175, 55, 0.1); }
    .admin-nav-item.active { background: var(--primary); color: var(--dark); font-weight: 600; }
    
    .admin-main { margin-left: 280px; flex: 1; padding: 30px; }
    .admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; }
    .admin-header h1 { font-size: 32px; }
    .exit-btn { padding: 10px 20px; background: var(--danger); color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
    .exit-btn:hover { background: #c0392b; }
    
    .section { display: none; }
    .section.active { display: block; }
    
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
    .stat-card { background: var(--dark); border: 1px solid rgba(212, 175, 55, 0.2); border-radius: 8px; padding: 20px; }
    .stat-card h3 { font-size: 14px; color: var(--muted); margin-bottom: 10px; }
    .stat-card .value { font-size: 28px; font-weight: bold; color: var(--primary); }
    
    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; margin-bottom: 8px; color: var(--primary); font-weight: 600; }
    .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 12px; background: var(--dark); border: 1px solid rgba(212, 175, 55, 0.2); border-radius: 6px; color: var(--light); font-family: inherit; }
    .form-group textarea { resize: vertical; min-height: 100px; }
    .form-group input:focus, .form-group textarea:focus, .form-group select:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 10px rgba(212, 175, 55, 0.2); }
    
    .btn-primary { padding: 12px 24px; background: var(--primary); color: var(--dark); border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
    .btn-primary:hover { background: #ffd700; }
    
    .notification-item { background: var(--dark); border: 1px solid rgba(212, 175, 55, 0.2); border-radius: 8px; padding: 16px; margin-bottom: 12px; }
    .notification-item .time { font-size: 12px; color: var(--muted); }
    .notification-item .message { margin-top: 8px; }
    
    .log-item { padding: 12px; border-bottom: 1px solid rgba(212, 175, 55, 0.1); font-size: 13px; }
    .log-item .status { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; }
    .log-item .status.success { background: rgba(39, 174, 96, 0.2); color: #27ae60; }
    .log-item .status.error { background: rgba(231, 76, 60, 0.2); color: #e74c3c; }
    
    .confirmation-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.8); z-index: 1000; align-items: center; justify-content: center; }
    .confirmation-modal.active { display: flex; }
    .confirmation-content { background: var(--dark); border: 1px solid var(--primary); border-radius: 12px; padding: 30px; max-width: 400px; text-align: center; }
    .confirmation-content h2 { color: var(--primary); margin-bottom: 20px; }
    .confirmation-content p { color: var(--muted); margin-bottom: 20px; }
    .confirmation-buttons { display: flex; gap: 12px; justify-content: center; }
    .confirmation-buttons button { padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
    .btn-confirm { background: var(--success); color: white; }
    .btn-cancel { background: var(--muted); color: var(--dark); }
    
    @media (max-width: 768px) {
      .admin-sidebar { width: 100%; height: auto; position: relative; border-right: none; border-bottom: 2px solid var(--primary); }
      .admin-main { margin-left: 0; }
    }
  </style>
</head>
<body>
  <!-- PIN Screen -->
  <div class="pin-screen" id="pinScreen">
    <div class="pin-container">
      <h1><i class="fas fa-lock"></i> Admin Portal</h1>
      <p>Enter your PIN to access the admin portal</p>
      <input type="password" class="pin-input" id="pinInput" placeholder="••••••" maxlength="7">
      <button class="pin-btn" onclick="verifyPin()">Access Portal</button>
      <div class="pin-error" id="pinError"></div>
    </div>
  </div>

  <!-- Admin Portal -->
  <div class="admin-container" id="adminContainer" style="display: none;">
    <div class="admin-sidebar">
      <div class="admin-sidebar-header">
        <div class="logo">Z</div>
        <div><strong>Admin</strong></div>
      </div>
      <nav class="admin-nav">
        <div class="admin-nav-item active" onclick="switchAdminSection('dashboard')"><i class="fas fa-chart-line"></i> Dashboard</div>
        <div class="admin-nav-item" onclick="switchAdminSection('notifications')"><i class="fas fa-bell"></i> Send Notifications</div>
        <div class="admin-nav-item" onclick="switchAdminSection('content')"><i class="fas fa-edit"></i> Manage Content</div>
        <div class="admin-nav-item" onclick="switchAdminSection('broadcast')"><i class="fas fa-megaphone"></i> Broadcast</div>
        <div class="admin-nav-item" onclick="switchAdminSection('logs')"><i class="fas fa-history"></i> System Logs</div>
      </nav>
    </div>

    <div class="admin-main">
      <div class="admin-header">
        <h1 id="sectionTitle">Dashboard</h1>
        <button class="exit-btn" onclick="exitAdminPortal()"><i class="fas fa-sign-out-alt"></i> Exit Portal</button>
      </div>

      <!-- Dashboard Section -->
      <div id="dashboard" class="section active">
        <div class="stats-grid">
          <div class="stat-card">
            <h3><i class="fas fa-users"></i> Total Users</h3>
            <div class="value" id="totalUsers">0</div>
          </div>
          <div class="stat-card">
            <h3><i class="fas fa-server"></i> Total Servers</h3>
            <div class="value" id="totalServers">0</div>
          </div>
          <div class="stat-card">
            <h3><i class="fas fa-bell"></i> Active Notifications</h3>
            <div class="value" id="activeNotifications">0</div>
          </div>
          <div class="stat-card">
            <h3><i class="fas fa-circle"></i> System Status</h3>
            <div class="value" style="color: #27ae60;">Online</div>
          </div>
        </div>
      </div>

      <!-- Notifications Section -->
      <div id="notifications" class="section">
        <div class="form-group">
          <label>Notification Message</label>
          <textarea id="notificationMessage" placeholder="Enter the notification message..."></textarea>
        </div>
        <div class="form-group">
          <label>Notification Type</label>
          <select id="notificationType">
            <option value="info">Info</option>
            <option value="success">Success</option>
            <option value="warning">Warning</option>
            <option value="error">Error</option>
          </select>
        </div>
        <button class="btn-primary" onclick="sendNotification()"><i class="fas fa-paper-plane"></i> Send Notification</button>
        <div id="recentNotifications" style="margin-top: 30px;"></div>
      </div>

      <!-- Content Management Section -->
      <div id="content" class="section">
        <div class="form-group">
          <label>Section</label>
          <select id="contentSection">
            <option value="header">Header</option>
            <option value="footer">Footer</option>
            <option value="homepage">Homepage</option>
            <option value="dashboard">Dashboard</option>
          </select>
        </div>
        <div class="form-group">
          <label>Key</label>
          <input type="text" id="contentKey" placeholder="e.g., title, description">
        </div>
        <div class="form-group">
          <label>New Value</label>
          <textarea id="contentValue" placeholder="Enter the new content..."></textarea>
        </div>
        <button class="btn-primary" onclick="updateContent()"><i class="fas fa-save"></i> Update Content</button>
      </div>

      <!-- Broadcast Section -->
      <div id="broadcast" class="section">
        <div class="form-group">
          <label>Broadcast Title</label>
          <input type="text" id="broadcastTitle" placeholder="Enter broadcast title...">
        </div>
        <div class="form-group">
          <label>Broadcast Message</label>
          <textarea id="broadcastMessage" placeholder="Enter broadcast message..."></textarea>
        </div>
        <div class="form-group">
          <label>Icon</label>
          <select id="broadcastIcon">
            <option value="info">Info</option>
            <option value="warning">Warning</option>
            <option value="success">Success</option>
            <option value="announcement">Announcement</option>
          </select>
        </div>
        <button class="btn-primary" onclick="sendBroadcast()"><i class="fas fa-broadcast-tower"></i> Send Broadcast</button>
      </div>

      <!-- Logs Section -->
      <div id="logs" class="section">
        <div id="systemLogs" style="background: var(--dark); border: 1px solid rgba(212, 175, 55, 0.2); border-radius: 8px; max-height: 500px; overflow-y: auto;"></div>
      </div>
    </div>
  </div>

  <!-- Confirmation Modal -->
  <div class="confirmation-modal" id="confirmationModal">
    <div class="confirmation-content">
      <h2>Confirm Changes</h2>
      <p id="confirmationMessage">Are you sure you want to make this change?</p>
      <div class="confirmation-buttons">
        <button class="btn-cancel" onclick="closeConfirmation()">Cancel</button>
        <button class="btn-confirm" onclick="confirmChanges()">Confirm</button>
      </div>
    </div>
  </div>

  <script>
    let adminToken = null;
    let pendingUpdate = null;

    function verifyPin() {
      const pin = document.getElementById('pinInput').value;
      const userId = '1416209242838401064'; // Your Discord ID
      
      fetch('/api/admin/verify-pin', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ pin, userId })
      })
      .then(r => r.json())
      .then(data => {
        if (data.success) {
          adminToken = data.token;
          document.getElementById('pinScreen').style.display = 'none';
          document.getElementById('adminContainer').style.display = 'flex';
          loadDashboard();
        } else {
          document.getElementById('pinError').textContent = 'Invalid PIN. Try again.';
          document.getElementById('pinInput').value = '';
        }
      })
      .catch(err => {
        document.getElementById('pinError').textContent = 'Error verifying PIN';
        console.error(err);
      });
    }

    function switchAdminSection(section) {
      document.querySelectorAll('.section').forEach(el => el.classList.remove('active'));
      document.getElementById(section).classList.add('active');
      document.querySelectorAll('.admin-nav-item').forEach(el => el.classList.remove('active'));
      event.target.closest('.admin-nav-item').classList.add('active');
      
      const titles = {
        dashboard: 'Dashboard',
        notifications: 'Send Notifications',
        content: 'Manage Content',
        broadcast: 'Broadcast Message',
        logs: 'System Logs'
      };
      document.getElementById('sectionTitle').textContent = titles[section];
      
      if (section === 'logs') loadSystemLogs();
    }

    function loadDashboard() {
      fetch('/api/admin/dashboard')
        .then(r => r.json())
        .then(data => {
          document.getElementById('totalUsers').textContent = data.totalUsers;
          document.getElementById('totalServers').textContent = data.totalServers;
          document.getElementById('activeNotifications').textContent = data.globalNotifications;
        })
        .catch(err => console.error(err));
    }

    function sendNotification() {
      const message = document.getElementById('notificationMessage').value;
      const type = document.getElementById('notificationType').value;
      
      if (!message) {
        alert('Please enter a message');
        return;
      }
      
      fetch('/api/admin/send-notification', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message, type })
      })
      .then(r => r.json())
      .then(data => {
        if (data.success) {
          alert('Notification sent to all users!');
          document.getElementById('notificationMessage').value = '';
          loadRecentNotifications();
        }
      })
      .catch(err => console.error(err));
    }

    function loadRecentNotifications() {
      fetch('/api/admin/notifications')
        .then(r => r.json())
        .then(notifications => {
          const html = notifications.slice(0, 5).map(n => `
            <div class="notification-item">
              <div class="time">${new Date(n.timestamp).toLocaleString()}</div>
              <div class="message">${n.message}</div>
            </div>
          `).join('');
          document.getElementById('recentNotifications').innerHTML = html || '<p style="color: var(--muted);">No notifications yet</p>';
        })
        .catch(err => console.error(err));
    }

    function updateContent() {
      const section = document.getElementById('contentSection').value;
      const key = document.getElementById('contentKey').value;
      const value = document.getElementById('contentValue').value;
      
      if (!key || !value) {
        alert('Please fill in all fields');
        return;
      }
      
      pendingUpdate = { section, key, value };
      document.getElementById('confirmationMessage').textContent = `Update ${section}.${key} to: "${value}"?`;
      document.getElementById('confirmationModal').classList.add('active');
    }

    function confirmChanges() {
      if (!pendingUpdate) return;
      
      fetch('/api/admin/confirm-update', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ updateId: Date.now(), confirmationCode: '1232009' })
      })
      .then(r => r.json())
      .then(data => {
        if (data.success) {
          alert('Changes committed globally!');
          closeConfirmation();
          document.getElementById('contentKey').value = '';
          document.getElementById('contentValue').value = '';
        }
      })
      .catch(err => console.error(err));
    }

    function closeConfirmation() {
      document.getElementById('confirmationModal').classList.remove('active');
      pendingUpdate = null;
    }

    function sendBroadcast() {
      const title = document.getElementById('broadcastTitle').value;
      const message = document.getElementById('broadcastMessage').value;
      const icon = document.getElementById('broadcastIcon').value;
      
      if (!title || !message) {
        alert('Please fill in all fields');
        return;
      }
      
      fetch('/api/admin/broadcast-message', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title, message, icon })
      })
      .then(r => r.json())
      .then(data => {
        if (data.success) {
          alert('Broadcast sent to all users!');
          document.getElementById('broadcastTitle').value = '';
          document.getElementById('broadcastMessage').value = '';
        }
      })
      .catch(err => console.error(err));
    }

    function loadSystemLogs() {
      fetch('/api/admin/system-logs')
        .then(r => r.json())
        .then(data => {
          const html = data.logs.map(log => `
            <div class="log-item">
              <span class="status ${log.status}">${log.status.toUpperCase()}</span>
              <span style="margin-left: 12px;">${log.action}</span>
              <span style="color: var(--muted); float: right; font-size: 11px;">${new Date(log.timestamp).toLocaleTimeString()}</span>
            </div>
          `).join('');
          document.getElementById('systemLogs').innerHTML = html;
        })
        .catch(err => console.error(err));
    }

    function exitAdminPortal() {
      if (confirm('Exit admin portal?')) {
        window.location.href = '/select-server';
      }
    }

    // Allow Enter key to submit PIN
    document.getElementById('pinInput').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') verifyPin();
    });

    // Load initial data
    loadRecentNotifications();
  </script>
</body>
</html>
