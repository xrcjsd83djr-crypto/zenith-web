<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zenith | Dashboard</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --primary: #d4af37;
      --primary-dark: #b8860b;
      --bg: #0f0f0f;
      --card-bg: #1a1a1a;
      --text: #ffffff;
      --text-muted: #a0a0a0;
      --border: #333333;
      --success: #27ae60;
      --error: #e74c3c;
      --warning: #f39c12;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
    body { background: var(--bg); color: var(--text); overflow-x: hidden; }
    .sidebar { width: 260px; height: 100vh; background: var(--card-bg); border-right: 1px solid var(--border); position: fixed; left: 0; top: 0; padding: 20px; z-index: 100; }
    .logo { display: flex; align-items: center; gap: 12px; font-size: 24px; font-weight: 800; color: var(--primary); margin-bottom: 40px; text-decoration: none; }
    .nav-link { display: flex; align-items: center; gap: 12px; padding: 12px 16px; color: var(--text-muted); text-decoration: none; border-radius: 8px; margin-bottom: 8px; transition: 0.2s; }
    .nav-link:hover, .nav-link.active { background: rgba(212, 175, 55, 0.1); color: var(--primary); }
    .main-content { margin-left: 260px; padding: 40px; min-height: 100vh; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; }
    .server-info { display: flex; align-items: center; gap: 16px; }
    .server-icon { width: 64px; height: 64px; border-radius: 16px; background: var(--border); }
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 24px; margin-bottom: 40px; }
    .stat-card { background: var(--card-bg); border: 1px solid var(--border); padding: 24px; border-radius: 16px; }
    .stat-value { font-size: 32px; font-weight: 800; color: var(--primary); margin: 8px 0; }
    .stat-label { color: var(--text-muted); font-size: 14px; }
    .section { display: none; }
    .section.active { display: block; }
    .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 16px; padding: 24px; margin-bottom: 24px; }
    .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .audit-log-item { display: flex; align-items: center; gap: 16px; padding: 12px; border-bottom: 1px solid var(--border); }
    .audit-log-item:last-child { border-bottom: none; }
    .log-type { padding: 4px 8px; border-radius: 4px; font-size: 10px; font-weight: 800; text-transform: uppercase; }
    .log-type.discord { background: #5865F2; color: white; }
    .log-type.bot { background: var(--primary); color: black; }
    .log-time { color: var(--text-muted); font-size: 12px; margin-left: auto; }
    .loader { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg); display: flex; justify-content: center; align-items: center; z-index: 1000; transition: 0.5s; }
    .loader.hidden { opacity: 0; pointer-events: none; }
  </style>
</head>
<body>
  <div class="loader" id="loader"><i class="fas fa-spinner fa-spin fa-3x" style="color: var(--primary);"></i></div>
  <div class="sidebar">
    <a href="/" class="logo">Zenith</a>
    <nav>
      <a href="#" class="nav-link active" data-section="overview"><i class="fas fa-home"></i> Overview</a>
      <a href="#" class="nav-link" data-section="staff"><i class="fas fa-users"></i> Staff Management</a>
      <a href="#" class="nav-link" data-section="audit"><i class="fas fa-list"></i> Audit Logs</a>
      <a href="#" class="nav-link" data-section="settings"><i class="fas fa-cog"></i> Settings</a>
      <div style="margin-top: 40px; padding-top: 20px; border-top: 1px solid var(--border);">
        <a href="/select-server" class="nav-link"><i class="fas fa-arrow-left"></i> Switch Server</a>
        <a href="#" class="nav-link" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</a>
      </div>
    </nav>
  </div>
  <div class="main-content">
    <div id="overview" class="section active">
      <div class="header">
        <div class="server-info">
          <img id="server-icon" class="server-icon" src="" alt="">
          <div>
            <h1 id="server-name">Loading...</h1>
            <p id="server-id" style="color: var(--text-muted); font-size: 14px;"></p>
          </div>
        </div>
        <div id="premium-badge"></div>
      </div>
      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-label">Total Staff</div>
          <div id="stat-staff" class="stat-value">0</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Active LOAs</div>
          <div id="stat-loa" class="stat-value">0</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Total Strikes</div>
          <div id="stat-strikes" class="stat-value">0</div>
        </div>
      </div>
    </div>
    <div id="staff" class="section">
      <div class="header"><h1>Staff Management</h1></div>
      <div class="card">
        <div id="staff-list">Loading staff...</div>
      </div>
    </div>
    <div id="audit" class="section">
      <div class="header"><h1>Audit Logs</h1></div>
      <div class="card">
        <div class="card-header">
          <h3>Combined Activity Feed</h3>
          <button class="btn btn-ghost" onclick="loadAuditLogs()"><i class="fas fa-sync"></i> Refresh</button>
        </div>
        <div id="audit-logs-list">Loading logs...</div>
      </div>
    </div>
    <div id="settings" class="section">
      <div class="header"><h1>Server Settings</h1></div>
      <div class="card">
        <p>Redirecting to configuration page...</p>
      </div>
    </div>
  </div>
  <script>
    const guildId = new URLSearchParams(window.location.search).get('id');
    if (!guildId) window.location.href = '/select-server';

    async function loadDashboardData() {
      try {
        const [guildRes, staffRes, premiumRes] = await Promise.all([
          fetch(`/api/guilds/${guildId}/detailed`),
          fetch(`/api/guilds/${guildId}/staff-with-status`),
          fetch(`/api/guilds/${guildId}/premium`)
        ]);
        
        const guild = await guildRes.json();
        const staff = await staffRes.json();
        const premium = await premiumRes.json();

        document.getElementById('server-name').textContent = guild.name;
        document.getElementById('server-id').textContent = `ID: ${guild.id}`;
        document.getElementById('server-icon').src = guild.icon ? `https://cdn.discordapp.com/icons/${guild.id}/${guild.icon}.png` : 'https://cdn.discordapp.com/embed/avatars/0.png';
        document.getElementById('stat-staff').textContent = staff.length;
        document.getElementById('premium-badge').innerHTML = premium.isPremium ? '<span style="background: var(--primary); color: black; padding: 4px 12px; border-radius: 20px; font-weight: 800; font-size: 12px;">PREMIUM</span>' : '<a href="/premium" style="color: var(--primary); text-decoration: none; font-size: 12px; font-weight: 800;">UPGRADE TO PREMIUM</a>';
        
        renderStaff(staff);
      } catch (err) {
        console.error('Error loading dashboard:', err);
      } finally {
        document.getElementById('loader').classList.add('hidden');
      }
    }

    function renderStaff(staff) {
      const container = document.getElementById('staff-list');
      if (!staff.length) {
        container.innerHTML = '<p style="color: var(--text-muted);">No staff members found.</p>';
        return;
      }
      container.innerHTML = staff.map(s => `
        <div style="display: flex; align-items: center; gap: 12px; padding: 12px; border-bottom: 1px solid var(--border);">
          <img src="${s.avatar_url}" style="width: 32px; height: 32px; border-radius: 50%;">
          <div>
            <div style="font-weight: 600;">${s.username}</div>
            <div style="font-size: 12px; color: var(--text-muted);">${s.highest_role}</div>
          </div>
        </div>
      `).join('');
    }

    async function loadAuditLogs() {
      const container = document.getElementById('audit-logs-list');
      container.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Loading logs...';
      try {
        const res = await fetch(`/api/guilds/${guildId}/audit-logs`);
        const logs = await res.json();
        container.innerHTML = logs.map(log => `
          <div class="audit-log-item">
            <span class="log-type ${log.type}">${log.type}</span>
            <div>
              <div style="font-weight: 600;">${log.action}</div>
              <div style="font-size: 12px; color: var(--text-muted);">${log.reason}</div>
            </div>
            <div class="log-time">${new Date(log.timestamp).toLocaleString()}</div>
          </div>
        `).join('');
      } catch (err) {
        container.innerHTML = '<p style="color: var(--error);">Failed to load logs.</p>';
      }
    }

    document.querySelectorAll('.nav-link').forEach(link => {
      link.addEventListener('click', (e) => {
        const section = link.dataset.section;
        if (section === 'settings') {
          window.location.href = `/settings-config?id=${guildId}`;
          return;
        }
        if (section === 'staff') {
          window.location.href = `/staff-roster?id=${guildId}`;
          return;
        }
        document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        link.classList.add('active');
        document.getElementById(section).classList.add('active');
        if (section === 'audit') loadAuditLogs();
      });
    });

    async function logout() {
      await fetch('/api/auth/logout', { method: 'POST' });
      window.location.href = '/';
    }

    loadDashboardData();
  </script>
</body>
</html>
